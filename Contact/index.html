<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact</title>
    <meta name="description" content="Contact: Gmail宛のお問い合わせ導線ページ。" />
    <link rel="stylesheet" href="../styles.css" />
    <script src="../analytics-config.js"></script>
    <script src="../analytics.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <span class="brand-placeholder" aria-hidden="true"></span>
        <nav class="site-nav" aria-label="メインナビゲーション">
          <a href="../">Home</a>
          <a href="../Create%20Item/">Create Item</a>
          <a href="../Information/">Information</a>
          <a class="active" href="./">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section hero">
        <div class="container">
          <p class="eyebrow">Contact</p>
          <h1>お問い合わせ</h1>
        </div>
      </section>

      <section class="section alt">
        <div class="container">
          <div class="form-wrap">
            <form id="contact-form" action="https://formsubmit.co/acsbne.company@gmail.com" method="post">
              <input type="hidden" name="_subject" value="kitsune-lp Contact" />
              <input type="hidden" name="_captcha" value="true" />
              <input type="hidden" name="_template" value="table" />
              <label for="name">お名前</label>
              <input id="name" name="name" type="text" required />

              <label for="email">メールアドレス</label>
              <input id="email" name="email" type="email" required />

              <label for="message">お問い合わせ内容</label>
              <textarea id="message" name="message" required></textarea>

              <button class="btn btn-primary" type="submit">送信する</button>
            </form>
            <p id="contact-status" class="note" aria-live="polite"></p>
            <p class="note">お問い合わせで取得した個人情報は、お問い合わせ対応の目的にのみ利用し、目的外利用は行いません。</p>
          </div>
        </div>
      </section>
    </main>
    <script>
      const contactForm = document.getElementById("contact-form");
      const statusText = document.getElementById("contact-status");
      contactForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusText.textContent = "送信中です...";
        const formData = new FormData(contactForm);
        try {
          const response = await fetch("https://formsubmit.co/ajax/acsbne.company@gmail.com", {
            method: "POST",
            body: formData,
            headers: { Accept: "application/json" },
          });
          if (!response.ok) throw new Error("send_failed");
          statusText.textContent = "送信が完了しました。内容を確認して返信いたします。";
          window.dispatchEvent(new CustomEvent("marketing:form_submit", { detail: { form: "contact" } }));
          contactForm.reset();
        } catch (error) {
          statusText.textContent = "送信に失敗しました。時間をおいて再度お試しください。";
        }
      });
    </script>
  </body>
</html>
